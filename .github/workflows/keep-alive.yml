name: Backend Keep-Alive Ping

on:
  schedule:
    # Runs every 5 minutes to prevent Render free tier from spinning down (15m inactivity timeout)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Backend Health Endpoint
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://bshotel-backend.onrender.com' }}
        run: |
          echo "Sending keep-alive ping to: $BACKEND_URL/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$BACKEND_URL/health" || echo "000")
          echo "HTTP response status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Backend is active, warm, and responsive!"
          else
            echo "⚠️ Health ping returned status $HTTP_STATUS. Waking instance..."
            sleep 5
            curl -s -f --max-time 45 "$BACKEND_URL/health" || echo "Instance waking up."
          fi

      - name: Keep Database Connection Pool Warm
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://bshotel-backend.onrender.com' }}
        run: |
          echo "Sending readiness ping to keep DB pool connection active..."
          curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$BACKEND_URL/ready" || echo "Ready ping sent."
          echo "✅ Keep-alive sequence completed successfully."

