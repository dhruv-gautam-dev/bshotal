[project]
name = "bs-hotel-backend"
version = "1.0.0"
description = "FastAPI backend for B.S. Hotel & Restaurant and Delicee"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "bcrypt>=4.1.2",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "reportlab>=4.1.0",
    "aiosmtplib>=3.0.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.2",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["B008", "E501", "E712"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
