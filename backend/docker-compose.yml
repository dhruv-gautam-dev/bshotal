services:
  db:
    image: postgres:16-alpine
    container_name: bshotel_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bshotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bshotel_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bshotel_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bshotel} -d ${POSTGRES_DB:-bshotel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: bshotel_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-bshotel}:${POSTGRES_PASSWORD:-bshotel_secret}@db:5432/${POSTGRES_DB:-bshotel_db}
      - ENVIRONMENT=production
    ports:
      - "8000:8000"

volumes:
  postgres_data:

